<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App POC - initData validation test (isolated, non-production)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background:#111318; color:#e6e6e6; padding:24px; max-width:480px; margin:0 auto; }
  h2 { font-size:18px; margin-bottom:4px; }
  .note { font-size:13px; color:#999; margin-bottom:20px; }
  button { width:100%; padding:14px; font-size:16px; border:none; border-radius:10px; background:#2ea6ff; color:#fff; margin-top:8px; }
  button:active { opacity:0.8; }
  #result { margin-top:20px; padding:16px; border-radius:10px; background:#1c1f26; font-family: ui-monospace, monospace; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .valid { color:#4caf50; }
  .invalid { color:#e57373; }
</style>
</head>
<body>
  <h2>Mini App POC</h2>
  <p class="note">Isolated test page. Not connected to production. No secrets here.</p>
  <button id="checkBtn">Validate with test backend</button>
  <div id="result">No result yet.</div>

<script>
  // Isolated POC test page only. Do not treat as production code.
  var VALIDATOR_URL = "https://weyzoascdrpktwceldwa.supabase.co/functions/v1/validate-init-data";
  var resultEl = document.getElementById("result");
  var btn = document.getElementById("checkBtn");

  function showResult(html, cls) {
    resultEl.innerHTML = html;
    resultEl.className = cls || "";
  }

  btn.addEventListener("click", function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) {
      showResult("Telegram.WebApp is not available.\nThis page is not open inside Telegram.", "invalid");
      return;
    }
    tg.ready();
    var initData = tg.initData || "";
    if (!initData) {
      showResult("No initData present on window.Telegram.WebApp.", "invalid");
      return;
    }
    // initData is sent directly to the isolated test validator only.
    // It is intentionally never stored in localStorage/sessionStorage
    // and never printed to the console.
    fetch(VALIDATOR_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: initData })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.valid) {
          showResult("valid: true\ntelegram_user_id: " + data.telegram_user_id, "valid");
        } else {
          showResult("valid: false\nreason: " + (data && data.reason ? data.reason : "unknown"), "invalid");
        }
      })
      .catch(function () {
        showResult("Request to validator failed.", "invalid");
      });
  });
</script>
</body>
</html>
